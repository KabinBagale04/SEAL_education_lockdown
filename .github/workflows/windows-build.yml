name: SEAL Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: windows-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven


      - name: Build SEAL
        shell: cmd
        run: mvnw.cmd clean package


      - name: Copy runtime dependencies
        shell: cmd
        run: mvnw.cmd dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory=target\\package-input


      - name: Prepare package input
        shell: cmd
        run: copy target\\SEAL-1.0-SNAPSHOT.jar target\\package-input\\


      - name: Create Windows app image
        shell: cmd
        run: >
          jpackage
          --type app-image
          --name SEAL
          --module-path target\\package-input
          --module com.example.seal/com.example.seal.Main
          --dest target\\dist
          --java-options "-Dfile.encoding=UTF-8"


      - name: Add Windows launch helpers
        shell: pwsh
        run: |
          @'
          @echo off
          cd /d "%~dp0"
          start "" "%~dp0SEAL.exe"
          '@ | Set-Content -Path "target\dist\SEAL\Run SEAL.bat" -Encoding ASCII

          @'
          @echo off
          cd /d "%~dp0"
          echo Starting SEAL in debug mode...
          echo.
          "%~dp0runtime\bin\java.exe" --module-path "%~dp0app" --module com.example.seal/com.example.seal.Main
          echo.
          echo If SEAL did not open, copy the error above and send it to Kabin.
          pause
          '@ | Set-Content -Path "target\dist\SEAL\Run SEAL Debug.bat" -Encoding ASCII

          @'
          SEAL Windows App

          1. Extract the downloaded zip first.
          2. Open the extracted SEAL folder.
          3. Double-click "Run SEAL.bat" or "SEAL.exe".
          4. If nothing opens, double-click "Run SEAL Debug.bat" and send the console error to Kabin.

          Keep the Render backend awake before logging in. The first login can be slow on the free tier.
          '@ | Set-Content -Path "target\dist\SEAL\README-FIRST.txt" -Encoding ASCII


      - name: Upload Maven build
        uses: actions/upload-artifact@v4
        with:
          name: seal-windows-build
          path: target/


      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: SEAL-Windows-App
          path: target/dist/SEAL/

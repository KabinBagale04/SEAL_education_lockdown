name: SEAL Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: windows-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven


      - name: Build SEAL
        shell: cmd
        run: mvnw.cmd clean package


      - name: Upload Maven build
        uses: actions/upload-artifact@v4
        with:
          name: seal-windows-build
          path: target/